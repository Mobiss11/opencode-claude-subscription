name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          bash -n install.sh
          bash -n verify.sh

      - name: JSON templates
        run: |
          python3 - <<'PY'
          import json, glob
          files = glob.glob("config/*.json")
          assert files, "no config templates found"
          for f in files:
              json.load(open(f))
              print("ok:", f)
          PY
